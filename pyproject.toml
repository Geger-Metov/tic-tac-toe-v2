[project]
name = "tic-tac-toe-v2"
version = "0.3.0"
description = "Tic-Tac-Toe REST API (FastAPI + SQLAlchemy + PostgreSQL) with Minimax and Basic Auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "alembic>=1.20.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[tool.uv]
# Это приложение, а не библиотека — не нужно собирать и устанавливать сам
# проект как пакет (в отличие от uv-дефолта для проектов с pyproject.toml).
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Позволяет тестам делать "import tic_tac_toe" без --app-dir/PYTHONPATH —
# pytest сам добавляет src/ в sys.path перед сбором тестов.
pythonpath = ["src"]
testpaths = ["tests"]
